[Browser]
; Windows virtual key code, decimal: F9=120, F10=121, F11=122 (default)
Hotkey=122
; Position and size relative to the FalloutNV client area (percent).
; These defaults place a 2D browser panel over the right side of the Pip-Boy UI.
XPercent=36
YPercent=16
WidthPercent=60
HeightPercent=70
HomePage=https://www.wikipedia.org/

; 1=diagnostic Gamebryo DDS surface instead of WebView2 window (NO web pages).
; Experimental, OFF by default.
SurfaceProbe=0

; 0 = display a static native DDS surface (recommended, no D3D9 frame uploads).
; 1 = enable dynamic texture upload, rate-limited by SurfaceProbeFps.
SurfaceProbeAnimation=0
; When animation is enabled: 1..10 updates/sec (not the game FPS).
SurfaceProbeFps=8
